// ========== Hash & PRNG ==========
function cyrb53(str,seed){
  seed=seed||0;
  var h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(var i=0;i<str.length;i++){
    var ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507);
  h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507);
  h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}

function mulberry32(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

  var now=new Date();
  var mid=new Date(now);
  mid.setHours(24,0,0,0);
  return mid-now;
}

function formatCountdown(ms){
  if(ms<=0) return '00:00:00';
  var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600);s%=3600;
  var m=Math.floor(s/60);s%=60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ========== Safe Storage Helpers ==========
function safeLSGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeLSSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function safeSSGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function safeSSSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function safeCookieGet(k){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return null;
    var name=k+'=';
    var decoded=decodeURIComponent(document.cookie);
    var ca=decoded.split(';');
    for(var i=0;i<ca.length;i++){var c=ca[i].trim();if(c.indexOf(name)===0)return c.substring(name.length);}
    return null;
  }catch(e){return null;}
}
function safeCookieSet(k,v,expiresStr){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    document.cookie=k+'='+encodeURIComponent(v)+';expires='+expiresStr+';path=/;SameSite=Lax';
  }catch(e){}
}

function safeIDBGet(key){
  return new Promise(function(resolve){
    try{
      var req=indexedDB.open('mcGuaDB',1);
      req.onerror=function(){resolve(null);};
      req.onupgradeneeded=function(e){
        try{var db=e.target.result;if(!db.objectStoreNames.contains('records'))db.createObjectStore('records',{keyPath:'key'});}catch(e2){}
      };
      req.onsuccess=function(e){
        try{
          var db=e.target.result;
          var tx=db.transaction('records','readonly');
          var store=tx.objectStore('records');
          var gr=store.get(key);
          gr.onsuccess=function(){resolve(gr.result?gr.result.value:null);};
          gr.onerror=function(){resolve(null);};
        }catch(e2){resolve(null);}
      };
    }catch(e){resolve(null);}
  });
}

function safeIDBSet(key,val){
  return new Promise(function(resolve){
    try{
      var req=indexedDB.open('mcGuaDB',1);
      req.onerror=function(){resolve();};
      req.onupgradeneeded=function(e){
        try{var db=e.target.result;if(!db.objectStoreNames.contains('records'))db.createObjectStore('records',{keyPath:'key'});}catch(e2){}
      };
      req.onsuccess=function(e){
        try{
          var db=e.target.result;
          var tx=db.transaction('records','readwrite');
          var store=tx.objectStore('records');
          store.put({key:key,value:val});
          tx.oncomplete=function(){resolve();};
          tx.onerror=function(){resolve();};
        }catch(e2){resolve();}
      };
    }catch(e){resolve();}
  });
}

// ========== Fingerprint ==========
var _fp=null;
function generateFingerprint(){
  if(_fp)return _fp;
  var parts=[];
  try{
    var cv=document.createElement('canvas');
    var ctx=cv.getContext('2d');
    ctx.textBaseline='top';ctx.font='14px Arial';
    ctx.fillText('fingerprint_test',2,2);
    parts.push(cv.toDataURL().slice(0,200));
  }catch(e){parts.push('no-canvas');}
  try{
    var cv2=document.createElement('canvas');
    var gl=cv2.getContext('webgl')||cv2.getContext('experimental-webgl');
    if(gl){var ext=gl.getExtension('WEBGL_debug_renderer_info');if(ext){parts.push(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'');parts.push(gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)||'');}}
  }catch(e){parts.push('no-webgl');}
  try{parts.push(navigator.userAgent||'');}catch(e){parts.push('no-ua');}
  try{parts.push(screen.width+'x'+screen.height+'x'+(screen.colorDepth||0));}catch(e){parts.push('no-screen');}
  try{parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone||'');}catch(e){parts.push('no-tz');}
  try{parts.push(navigator.language||'');}catch(e){parts.push('no-lang');}
  try{parts.push(navigator.platform||'');}catch(e){parts.push('no-platform');}
  try{parts.push(String(navigator.hardwareConcurrency||0));}catch(e){parts.push('no-hc');}
  var hash=cyrb53(parts.join('|||'));
  _fp=hash.toString(16);
  return _fp;
}

// ========== Five-Layer Check ==========
function checkDailyLimit(today){
  var blocked=false;
  var storedResult=null;
  // Layer 1: localStorage
  try{
    var lsDate=safeLSGet('mcGua_last');
    if(lsDate===today){blocked=true;try{var r=safeLSGet('mcGua_result');if(r)storedResult=JSON.parse(r);}catch(e){}}
  }catch(e){}
  // Layer 2: fingerprint key in localStorage
  if(!blocked){
    try{
      var fp=safeLSGet('mcGua_fp_'+generateFingerprint());
      if(fp===today)blocked=true;
    }catch(e){}
  }
  // Layer 3: sessionStorage
  if(!blocked){
    try{
      var ss=safeSSGet('mcGua_day');
      if(ss===today)blocked=true;
    }catch(e){}
  }
  // Layer 4: Cookie
  if(!blocked){
    try{
      var ck=safeCookieGet('mc_gua_day');
      if(ck===today)blocked=true;
    }catch(e){}
  }
  // Layer 5: IndexedDB (async, handled separately)
  return {blocked:blocked,storedResult:storedResult};
}

function checkDailyLimitAsync(today){
  var idbPromise=safeIDBGet('last').then(function(val){
    return val===today;
  }).catch(function(){return false;});
  var timeoutPromise=new Promise(function(resolve){setTimeout(function(){resolve(false);},3000);});
  return Promise.race([idbPromise,timeoutPromise]);
}

function writeDailyLimit(today,resultJSON){
  // Layer 1
  safeLSSet('mcGua_last',today);
  safeLSSet('mcGua_result',resultJSON);
  // Layer 2
  try{safeLSSet('mcGua_fp_'+generateFingerprint(),today);}catch(e){}
  // Layer 3
  safeSSSet('mcGua_day',today);
  // Layer 4
  try{
    var mid=new Date();mid.setHours(24,0,0,0);
    safeCookieSet('mc_gua_day',today,mid.toUTCString());
  }catch(e){}
  // Layer 5
  safeIDBSet('last',today).catch(function(){});
}

// ========== 逆天改命 Detection ==========
function checkCheat(today){
  try{
    var total=parseInt(safeLSGet('mcGua_total'))||0;
    var firstDate=safeLSGet('mcGua_first');
    if(!firstDate){
      safeLSSet('mcGua_first',today);
      safeLSSet('mcGua_total','1');
      return false;
    }
    var d1=new Date(firstDate+'T00:00:00');
    var d2=new Date(today+'T00:00:00');
    var days=Math.floor((d2-d1)/86400000)+1;
    if(days<1)days=1;
    if(total>days)return true;
    return false;
  }catch(e){return false;}
}

function incrementTotal(){

  }catch(e){}
}

// ========== Fortune Generation ==========
function generateFortune(today,fp){
  var seed=cyrb53(today+fp);
  var rng=mulberry32(seed);

  // 6 yao
  var yaos=[];
  for(var i=0;i<6;i++) yaos.push(rng()>=0.5?1:0);

  // Upper trigram (yao 0,1,2 from bottom), Lower trigram (yao 3,4,5)
  var upperIdx=yaos[0]*4+yaos[1]*2+yaos[2]*1;
  var lowerIdx=yaos[3]*4+yaos[4]*2+yaos[5]*1;
  var upper=TRIGRAMS[upperIdx];
  var lower=TRIGRAMS[lowerIdx];

  // Fortune score
  var score=(upper.weight+lower.weight)/2+rng();
  var level=null;
  for(var j=FORTUNE_LEVELS.length-1;j>=0;j--){
    if(score>=FORTUNE_LEVELS[j].min){level=FORTUNE_LEVELS[j];break;}
  }
  if(!level)level=FORTUNE_LEVELS[0];

  // Guaci
  var guaciIdx=Math.floor(rng()*GUACI_POOL.length);
  var guaci=GUACI_POOL[guaciIdx];

  // Yi (3 non-repeating)
  var yiPick=pickN(rng,YI_POOL,3);
  // Ji (3 non-repeating)
  var jiPick=pickN(rng,JI_POOL,3);
  // Tips (3 non-repeating)
  var tipsPick=pickN(rng,TIPS_POOL,3);

  // Lucky
  var luckyItem=LUCKY_ITEMS[Math.floor(rng()*LUCKY_ITEMS.length)];
  var luckyEnchant=LUCKY_ENCHANTS[Math.floor(rng()*LUCKY_ENCHANTS.length)];
  var coordIdx=Math.floor(rng()*LUCKY_COORDS.length);
  var luckyCoord=LUCKY_COORDS[coordIdx];
  // Dynamic coord ~40% chance
  if(rng()<0.4){
    var cx=Math.floor(rng()*9900)+100;
    var cz=Math.floor(rng()*9900)+100;
    if(rng()<0.5)cx=-cx;
    if(rng()<0.5)cz=-cz;
    luckyCoord='X: '+cx+', Z: '+cz;
  }
  var woolIdx=Math.floor(rng()*WOOL_COLORS.length);
  var wool=WOOL_COLORS[woolIdx];

  // Poem
  var poemIdx=Math.floor(rng()*POEM_POOL.length);
  var poem=POEM_POOL[poemIdx];

  // Masked IP from fingerprint
  var fpNum=cyrb53(fp);
  var ipPart1=(Math.abs(fpNum)%200)+10;
  var ipPart2=(Math.abs(cyrb53(fp+'b'))%200)+10;
  var maskedIP=ipPart1+'.'+ipPart2+'.*.*';

  return {
    date:today,ip:maskedIP,yaos:yaos,
    upper:upper,lower:lower,
    guaName:upper.name+lower.name+'卦',
    level:level,score:score,
    guaci:guaci,
    yi:yiPick,ji:jiPick,tips:tipsPick,
    luckyItem:luckyItem,luckyEnchant:luckyEnchant,
    luckyCoord:luckyCoord,wool:wool,
    poem:poem
  };
}

function pickN(rng,arr,n){
  var copy=arr.slice();
  var result=[];
  for(var i=0;i<n&&copy.length>0;i++){
    var idx=Math.floor(rng()*copy.length);
    result.push(copy[idx]);
    copy.splice(idx,1);
  }
  return result;
}


// ========== Sound ==========
function playDing(){
  try{
    var ac=new (window.AudioContext||window.webkitAudioContext)();
    var osc=ac.createOscillator();
    var gain=ac.createGain();
    osc.type='sine';osc.frequency.value=880;
    gain.gain.setValueAtTime(0.3,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+0.5);
    osc.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.5);
  }catch(e){}
}

// ========== Device Detection ==========

function detectDevice(){
  try{
    var ua=navigator.userAgent||'';
    if(/iPhone|iPad|iPod/i.test(ua))return 'iPhone';
    if(/Android/i.test(ua))return 'Android';
    if(/Macintosh|Mac OS/i.test(ua))return 'MacBook';
    if(/Windows/i.test(ua))return 'Windows PC';
    return 'Unknown';
  }catch(e){return 'Unknown';}
}

function startAnimation(callback){

  btn.disabled=true;

  var startTime=Date.now();

  var textInterval=setInterval(function(){
    textIdx=(textIdx+1)%ANIM_TEXTS.length;
    animText.textContent=ANIM_TEXTS[textIdx];
  },750);

  var progressInterval=setInterval(function(){
    var elapsed=Date.now()-startTime;
    var pct=Math.min(100,Math.floor(elapsed/duration*100));
    progressFill.style.width=pct+'%';
    if(elapsed>=duration){

      progressFill.style.width='100%';

        animWrap.style.display='none';
        btn.style.display='none';
        document.querySelector('.btn-sub').style.display='none';
        document.querySelector('.guide-text').style.display='none';
        callback();
      },200);
    }
  },50);
}

      document.getElementById('fortuneBtn').style.display='none';
      document.querySelector('.btn-sub').style.display='none';
      renderResult(fortune,true,false);
      startCountdown();
    }else{
      // Not blocked - check cheat
      var isCheat=checkCheat(today);

      // Setup button click
      var btn=document.getElementById('fortuneBtn');
      btn.addEventListener('click',function(){
        playDing();
        startAnimation(function(){
          var fortune=generateFortune(today,fp);
          var resultJSON=JSON.stringify(fortune);
          writeDailyLimit(today,resultJSON);
          incrementTotal();
          saveLocalRecord(fortune);
          countFortune(today);
          saveLastFortune(fortune);
          renderResult(fortune,false,isCheat);
          playDing();
          renderLastFortune();
          renderRecords();
        });
      });
    }
    renderRecords();
  }).catch(function(){
    // IDB check failed, treat as not blocked
    var isCheat=checkCheat(today);
    var btn=document.getElementById('fortuneBtn');
    btn.addEventListener('click',function(){
      playDing();
      startAnimation(function(){
        var fortune=generateFortune(today,fp);
        var resultJSON=JSON.stringify(fortune);
        writeDailyLimit(today,resultJSON);
        incrementTotal();
        saveLocalRecord(fortune);
        countFortune(today);
        saveLastFortune(fortune);
        renderResult(fortune,false,isCheat);
        playDing();
        renderLastFortune();
        renderRecords();
      });
    });
    renderRecords();
  });
}

// ========== Global Error Handling ==========
window.onerror=function(msg,url,line){
  // Silently handle to prevent white screen
  try{
    var btn=document.getElementById('fortuneBtn');
    if(btn&&btn.disabled)btn.disabled=false;
  }catch(e){}
  return true;
};

// ========== Bootstrap ==========
try{
  main();
}catch(e){
  try{
    var btn=document.getElementById('fortuneBtn');
    if(btn){
      btn.disabled=false;
      btn.textContent='开始算卦';
    }
  }catch(e2){}
}

})();
</script>
